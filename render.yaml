services:
  - type: web
    name: careai-mental-health-system
    env: python
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120 wsgi:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: WTF_CSRF_ENABLED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: careai-db
          property: connectionString
      - key: OLLAMA_HOST
        value: "https://fence-ross-spotlight-remains.trycloudflare.com"
      - key: OLLAMA_MODEL
        value: "llama3.2"

databases:
  - name: careai-db
    databaseName: careai_db
    user: careai_user
    plan: free
