services:
  - type: web
    name: careai-mental-health-system
    env: python
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120 wsgi:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: "production"
      - key: AI_PROVIDER
        value: "groq"
      - key: GROQ_MODEL
        value: "openai/gpt-oss-120b"
      - key: GROQ_FALLBACK_MODEL
        value: "openai/gpt-oss-20b"
      - key: GROQ_API_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: WTF_CSRF_ENABLED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: careai-db
          property: connectionString

databases:
  - name: careai-db
    databaseName: careai_db
    user: careai_user
    plan: free
